[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tam-fno-underwater-acoustic-prediction"
version = "0.1.0"
description = "Time-adaptive modulated Fourier Neural Operator for underwater acoustic prediction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yufei Yang" }
]
keywords = [
  "underwater acoustics",
  "Fourier neural operator",
  "scientific machine learning",
  "transmission loss",
  "time modulation"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "h5py>=3.11",
  "torch",
  "matplotlib",
  "pandas",
  "scikit-image",
  "scikit-learn",
  "tqdm"
]

[project.urls]
Homepage = "https://yufeila.github.io/TAM-FNO-Underwater-Acoustic-Prediction/"
Repository = "https://github.com/yufeila/TAM-FNO-Underwater-Acoustic-Prediction"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "io_mat",
  "normalizer",
  "tam_fno_config",
  "tam_fno_data",
  "tam_fno_model",
  "tam_fno_split",
  "tam_fno_time",
  "tam_fno_train"
]
